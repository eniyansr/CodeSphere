<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSphere Pro | Sign in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='16' x='2' y='4' rx='4'/%3E%3Cpath d='m8 10 3 3-3 3'/%3E%3Cpath d='M13 16h3'/%3E%3C/svg%3E">
  
  <!-- Google Fonts: Bricolage Grotesque & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            accent: {
              cyan: '#0E9F9A',
              emerald: '#16A34A',
              rose: '#E5484D',
              amber: '#F59E0B'
            }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', 'system-ui', 'Segoe UI', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #E9EFFB;
      --paper: #FFFFFF;
      --ink: #16213E;
      --mute: #566180;
      --line: #D5DEF2;
      --indigo: #4F46E5;
      --indigo-d: #3730A3;
      --teal: #0E9F9A;
      --teal-d: #0A6F6B;
      --amber: #F59E0B;
      --amber-d: #B45309;
      --coral: #E5484D;
      --coral-d: #A62A30;
      --green: #16A34A;
      --green-d: #0F7A36;
      --shadow: rgba(22, 33, 62, 0.28);
      --fs: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: var(--fs); }
    body {
      font-family: "Bricolage Grotesque", system-ui, Segoe UI, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 12% -10%, #fff 0, transparent 60%),
        radial-gradient(800px 600px at 100% 100%, #DCE6FB 0, transparent 60%),
        var(--bg);
      min-height: 100vh;
      line-height: 1.45;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 0.35;
      mask-image: radial-gradient(circle at 50% 40%, #000 0, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0, transparent 75%);
    }

    body.hc {
      --ink: #000;
      --mute: #222;
      --line: #8A94B0;
      --paper: #fff;
    }

    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }

    /* ---------- 3D Buttons & Tactile Keys ---------- */
    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 0.85rem 1.2rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #6366F1, var(--indigo));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 5px 0 var(--indigo-d), 0 14px 20px -6px var(--shadow);
      transition: transform 0.12s, box-shadow 0.12s;
      width: 100%;
      text-align: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 7px 0 var(--indigo-d), 0 18px 24px -6px var(--shadow);
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 1px 0 var(--indigo-d), 0 4px 8px -4px var(--shadow);
    }

    .btn.teal {
      background: linear-gradient(180deg, #14B8B2, var(--teal));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 5px 0 var(--teal-d), 0 14px 20px -6px var(--shadow);
    }
    .btn.teal:hover {
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 7px 0 var(--teal-d), 0 18px 24px -6px var(--shadow);
    }
    .btn.teal:active {
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 1px 0 var(--teal-d), 0 4px 8px -4px var(--shadow);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--line), 0 8px 14px -8px var(--shadow);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .chip:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--line);
    }

    /* ---------- Modular Theme Panel Overrides ---------- */
    .glass-panel {
      background: #FFFFFF !important;
      border: 1px solid #D5DEF2 !important;
      border-radius: 20px !important;
      box-shadow: 0 1px 0 #fff inset, 0 8px 0 -2px #CBD5EE, 0 28px 36px -18px var(--shadow) !important;
      color: #16213E !important;
    }
    .glass-input {
      background: #FFFFFF !important;
      border: 1px solid #D5DEF2 !important;
      border-radius: 12px !important;
      box-shadow: inset 0 2px 4px rgba(22, 33, 62, 0.08) !important;
      color: #16213E !important;
    }
    .glass-input:focus {
      border-color: var(--indigo) !important;
      box-shadow: inset 0 2px 4px rgba(22, 33, 62, 0.08), 0 0 0 4px rgba(79, 70, 229, 0.18) !important;
      outline: none;
    }

    /* ---------- 3D Hero Scene on Auth Landing ---------- */
    .l-wrap { display: grid; grid-template-columns: 1.15fr 0.85fr; min-height: 100vh; }
    .hero { padding: 2.5rem 3rem; display: flex; flex-direction: column; gap: 1.4rem; }
    .logo { display: flex; align-items: center; gap: 0.8rem; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
    .logo i {
      width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff;
      font-style: normal; font-family: "JetBrains Mono", monospace; font-weight: 700;
      background: linear-gradient(145deg, #818CF8, var(--indigo));
      box-shadow: 0 4px 0 var(--indigo-d), 0 12px 18px -6px var(--shadow);
      transform: rotate(-6deg);
    }
    .logo small {
      font-size: 0.7rem; font-weight: 700; color: var(--indigo); background: #E4E6FF;
      border-radius: 8px; padding: 0.1rem 0.45rem; margin-left: 0.3rem; vertical-align: middle;
    }
    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 4.4rem); line-height: 0.98; letter-spacing: -0.04em; font-weight: 800;
      text-shadow: 0 1px 0 #fff, 0 3px 0 #C9D3EE, 0 6px 0 #B8C4E6, 0 14px 18px rgba(22, 33, 62, 0.2);
    }
    .hero h1 em { font-style: normal; color: var(--indigo); }
    .hero p.lead { max-width: 34rem; color: var(--mute); font-size: 1.1rem; }

    .scene { perspective: 1100px; height: 380px; position: relative; margin: 0.5rem 0; }
    .stage {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform 0.2s ease-out; transform: rotateX(var(--rx, 8deg)) rotateY(var(--ry, -14deg));
    }
    .plate {
      position: absolute; background: #fff; border-radius: 18px; border: 1px solid var(--line);
      box-shadow: 0 1px 0 #fff inset, 0 10px 0 -2px #CBD5EE, 0 30px 40px -12px var(--shadow);
    }
    .p-code { left: 2%; top: 18px; width: 62%; height: 250px; transform: translateZ(20px); padding: 1rem 1.1rem; }
    .p-cam { right: 4%; top: 0; width: 200px; height: 150px; transform: translateZ(110px); padding: 0.7rem; }
    .p-board { right: 10%; bottom: 0; width: 230px; transform: translateZ(70px); padding: 0.9rem 1rem; }
    .p-badge {
      left: 8%; bottom: 0; transform: translateZ(130px); padding: 0.7rem 1rem; display: flex;
      gap: 0.6rem; align-items: center; font-weight: 700; color: var(--green-d); background: #E8F9EE; border-color: #BDEBCB;
    }
    .dots { display: flex; gap: 6px; margin-bottom: 0.7rem; }
    .dots b { width: 10px; height: 10px; border-radius: 50%; background: #FF6B6B; }
    .dots b:nth-child(2) { background: #FBBF24; }
    .dots b:nth-child(3) { background: #34D399; }
    .code { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; line-height: 1.75; color: #334155; white-space: pre; }
    .k { color: #7C3AED; font-weight: 600; }
    .f { color: #0E7490; font-weight: 600; }
    .s { color: #C2410C; }
    .c { color: #94A3B8; }
    .cam {
      height: 100%; border-radius: 12px; background: linear-gradient(160deg, #DDE6FB, #C7D5F7);
      position: relative; display: grid; place-items: center;
    }
    .cam::before { content: ""; width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: 0 20px 0 -8px #fff; }
    .cam span {
      position: absolute; left: 8px; bottom: 8px; font-size: 0.7rem; font-weight: 700;
      background: #fff; border-radius: 8px; padding: 0.15rem 0.5rem; color: var(--green-d);
    }
    .row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.3rem 0; border-bottom: 1px dashed var(--line); }
    .row:last-child { border: 0; }

    .feats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; max-width: 36rem; }
    .feat {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0.8rem 1rem;
      box-shadow: 0 4px 0 var(--line), 0 14px 20px -12px var(--shadow);
    }
    .feat b { display: block; font-weight: 700; }
    .feat span { color: var(--mute); font-size: 0.9rem; }

    .panel { display: grid; place-items: center; padding: 2rem; perspective: 1400px; }
    .card3d {
      width: 100%; max-width: 440px; background: linear-gradient(180deg, #fff, #F6F8FE);
      border: 1px solid var(--line); border-radius: 26px; padding: 2rem;
      box-shadow: 0 1px 0 #fff inset, 0 12px 0 -3px #C9D4EE, 0 40px 60px -20px var(--shadow);
      transform-style: preserve-3d; transition: transform 0.2s ease-out;
    }
    .card3d h2 { font-size: 1.9rem; letter-spacing: -0.03em; font-weight: 800; }
    .card3d .sub { color: var(--mute); margin-bottom: 1.2rem; font-size: 0.95rem; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #E3EAF8; border-radius: 14px; padding: 4px; margin-bottom: 1.2rem; }
    .tabs button { border: 0; background: none; padding: 0.6rem; border-radius: 11px; font-weight: 700; cursor: pointer; color: var(--mute); }
    .tabs button[aria-selected=true] {
      background: #fff; color: var(--ink); box-shadow: 0 3px 0 #C3CEE8, 0 6px 10px -4px var(--shadow);
    }

    .field { display: block; margin-bottom: 0.9rem; font-weight: 600; font-size: 0.92rem; }
    .field input {
      display: block; width: 100%; margin-top: 0.35rem; padding: 0.8rem 0.9rem; border-radius: 12px;
      border: 1px solid var(--line); background: #fff; box-shadow: inset 0 3px 6px rgba(22, 33, 62, 0.08); font-weight: 500;
    }
    .field input:focus {
      outline: none; border-color: var(--indigo);
      box-shadow: inset 0 3px 6px rgba(22, 33, 62, 0.08), 0 0 0 4px rgba(79, 70, 229, 0.18);
    }

    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.9rem; }
    .seg label { cursor: pointer; }
    .seg input { position: absolute; opacity: 0; }
    .seg span {
      display: block; text-align: center; padding: 0.7rem; border-radius: 12px;
      border: 1px solid var(--line); background: #fff; font-weight: 700; box-shadow: 0 4px 0 var(--line); transition: 0.12s;
    }
    .seg input:checked + span {
      background: #EEF0FF; border-color: var(--indigo); color: var(--indigo-d); box-shadow: 0 4px 0 #B9BEF7;
    }

    .or { display: flex; align-items: center; gap: 0.8rem; color: var(--mute); font-size: 0.88rem; margin: 1.3rem 0 0.8rem; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.45rem; margin-bottom: 0.9rem; }
    .otp input {
      width: 100%; aspect-ratio: 1/1.15; text-align: center; font-family: "JetBrains Mono", monospace;
      font-weight: 700; font-size: 1.2rem; text-transform: uppercase; border-radius: 12px;
      border: 1px solid var(--line); background: #fff; box-shadow: inset 0 3px 6px rgba(22, 33, 62, 0.08), 0 3px 0 var(--line);
    }
    .otp input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(14, 159, 154, 0.2); }
    .err { color: var(--coral-d); font-size: 0.88rem; min-height: 1.2rem; margin-bottom: 0.4rem; }
    .foot { display: flex; gap: 1rem; justify-content: center; margin-top: 1.2rem; font-size: 0.85rem; color: var(--mute); }
    .foot a { color: inherit; text-decoration: underline; }

    /* ---------- 3D Dashboard Styles ---------- */
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
    .head h2 {
      font-size: 2.1rem; letter-spacing: -0.035em; line-height: 1.1;
      text-shadow: 0 1px 0 #fff, 0 3px 0 #D3DBF0; font-weight: 800;
    }
    .rating {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 0.7rem 1.1rem;
      font-weight: 700; box-shadow: 0 4px 0 var(--line), 0 14px 20px -12px var(--shadow);
    }
    .scene3d { perspective: 1200px; }
    .tilt { transform-style: preserve-3d; transition: transform 0.18s ease-out, box-shadow 0.18s; will-change: transform; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.1rem; margin-bottom: 1.4rem; }
    .stat {
      --c: var(--indigo); --cd: var(--indigo-d); background: #fff; border: 1px solid var(--line);
      border-radius: 20px; padding: 1.1rem 1.2rem; position: relative; overflow: hidden;
      box-shadow: 0 1px 0 #fff inset, 0 8px 0 -1px var(--cd), 0 26px 30px -14px var(--shadow);
    }
    .stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--c); opacity: 0.12; }
    .stat.t { --c: var(--teal); --cd: var(--teal-d); }
    .stat.a { --c: var(--amber); --cd: var(--amber-d); }
    .stat.g { --c: var(--green); --cd: var(--green-d); }
    .stat small { color: var(--mute); font-weight: 600; display: block; }
    .stat strong { display: block; font-size: 1.6rem; letter-spacing: -0.03em; color: var(--cd); transform: translateZ(30px); font-weight: 800; }
    .stat .ic {
      position: absolute; right: 1rem; top: 1rem; width: 38px; height: 38px; border-radius: 12px;
      background: var(--c); color: #fff; display: grid; place-items: center; transform: translateZ(40px);
      box-shadow: 0 4px 0 var(--cd); font-weight: bold;
    }

    .grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1.1rem; margin-bottom: 1.4rem; }
    .box {
      background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 1.3rem;
      box-shadow: 0 1px 0 #fff inset, 0 8px 0 -2px #CBD5EE, 0 28px 36px -18px var(--shadow);
    }
    .box h3 { font-size: 1.1rem; margin-bottom: 1rem; letter-spacing: -0.01em; font-weight: 800; color: var(--ink); }

    .chart { width: 100%; height: auto; overflow: visible; }
    .chart text { font-size: 11px; fill: var(--mute); font-family: inherit; }

    .skill { margin-bottom: 1.1rem; }
    .skill div { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.35rem; }
    .bar { height: 14px; border-radius: 10px; background: #E3EAF8; box-shadow: inset 0 3px 5px rgba(22, 33, 62, 0.15); overflow: hidden; }
    .bar i {
      display: block; height: 100%; border-radius: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent 55%), var(--c);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); transform-origin: left;
      animation: grow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes grow { from { transform: scaleX(0); } }
    .focus { display: flex; justify-content: space-between; color: var(--mute); font-size: 0.85rem; border-top: 1px dashed var(--line); padding-top: 0.8rem; margin-top: 1.4rem; }

    .arena { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .prob { background: #F7F9FE; border: 1px solid var(--line); border-radius: 18px; padding: 1rem; box-shadow: 0 5px 0 var(--line), 0 18px 22px -14px var(--shadow); }
    .prob header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; transform: translateZ(20px); }
    .tag { font-size: 0.75rem; font-weight: 700; border-radius: 8px; padding: 0.15rem 0.55rem; }
    .tag.easy { background: #DDF5E6; color: var(--green-d); }
    .tag.medium { background: #FFEFCC; color: var(--amber-d); }
    .tag.hard { background: #FFE0E1; color: var(--coral-d); }
    .solved { color: var(--green-d); font-weight: 700; font-size: 0.85rem; }
    .prob h4 { font-size: 1.02rem; margin-bottom: 0.9rem; transform: translateZ(25px); font-weight: 700; }
    .prob .btn { padding: 0.6rem; font-size: 0.9rem; transform: translateZ(15px); }

    /* Accessibility Text Scaling */
    .text-scale-sm { font-size: 0.875rem !important; }
    .text-scale-base { font-size: 1rem !important; }
    .text-scale-lg { font-size: 1.125rem !important; }
    .text-scale-xl { font-size: 1.25rem !important; }

    /* Responsive */
    @media (max-width: 1100px) { .stats, .arena { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 860px) {
      .l-wrap { grid-template-columns: 1fr; } .hero { padding: 1.5rem; } .scene { display: none; } .panel { order: -1; padding: 1rem; }
    }
    @media (max-width: 520px) { .stats, .arena { grid-template-columns: 1fr; } .feats { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .stage, .tilt, .card3d { transform: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Branded 3D Loading Overlay -->
  <div id="app-loading" class="fixed inset-0 bg-[#E9EFFB] z-50 flex flex-col items-center justify-center p-6 space-y-6 select-none">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white font-mono font-bold text-2xl shadow-xl animate-pulse"
           style="background: linear-gradient(145deg, #818CF8, #4F46E5); box-shadow: 0 4px 0 #3730A3, 0 14px 20px -6px rgba(22,33,62,0.3); transform: rotate(-6deg);">
        &gt;_
      </div>
    </div>

    <div class="text-center space-y-1">
      <div class="text-2xl font-black tracking-tight text-[#16213E] flex items-center justify-center gap-2">
        CodeSphere <span class="text-xs font-bold uppercase tracking-widest px-2 py-0.5 rounded-md bg-[#E4E6FF] text-[#4F46E5]">Pro</span>
      </div>
      <p class="text-xs text-[#566180] font-semibold tracking-wide">Loading 3D compiler runtime, proctoring & modules...</p>
    </div>

    <div class="w-52 h-1.5 rounded-full bg-[#D5DEF2] overflow-hidden relative">
      <div class="h-full bg-gradient-to-r from-indigo-500 via-teal-400 to-indigo-500 rounded-full animate-pulse" style="width: 75%;"></div>
    </div>
  </div>

  <!-- Primary React Application Container -->
  <div id="app-container" class="flex-grow flex flex-col min-h-screen hidden">
    <!-- Populated by React Modules in ./src/app.js -->
  </div>

  <!-- Main ES6 Entry Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
