<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSphere Pro | Sign in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='16' x='2' y='4' rx='4'/%3E%3Cpath d='m8 10 3 3-3 3'/%3E%3Cpath d='M13 16h3'/%3E%3C/svg%3E">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            darkbg: '#080a10',
            panelbg: 'rgba(15, 23, 42, 0.65)',
            panelborder: 'rgba(148, 163, 184, 0.08)',
            accent: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              rose: '#f43f5e',
              amber: '#f59e0b'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          backdropBlur: {
            xs: '2px',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
            'glass-inset': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.05)',
            'glow-cyan': '0 0 15px rgba(6, 182, 212, 0.4)',
            'glow-indigo': '0 0 15px rgba(99, 102, 241, 0.4)',
          },
          animation: {
            'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 8s linear infinite',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Pyodide is loaded lazily on demand in EditorWorkspace.js when Python code is run -->
  <!-- RequireJS is not needed since @monaco-editor/react loads Monaco from esm.sh -->

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.3);
    }

    body {
      background-color: #080a10;
      color: #f8fafc;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
      outline: none;
    }

    /* Accessibility scale support */
    .text-scale-sm { font-size: 0.875rem !important; }
    .text-scale-base { font-size: 1rem !important; }
    .text-scale-lg { font-size: 1.125rem !important; }
    .text-scale-xl { font-size: 1.25rem !important; }

    /* High Contrast overrides */
    .high-contrast {
      background-color: #000000 !important;
      color: #ffffff !important;
    }
    .high-contrast .glass-panel {
      background: #000000 !important;
      border: 2px solid #ffffff !important;
    }
    .high-contrast button {
      border: 2px solid #ffffff !important;
      color: #ffffff !important;
    }

    /* Dot Grid Textures */
    .dot-grid-bg {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.25px, transparent 1.25px);
      background-size: 24px 24px;
    }
    .light .dot-grid-bg,
    html.light .dot-grid-bg {
      background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1.25px, transparent 1.25px);
      background-size: 24px 24px;
    }

    /* Light Mode Overrides */
    html.light body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.light .glass-panel {
      background: rgba(255, 255, 255, 0.85) !important;
      border: 1px solid rgba(226, 232, 240, 0.9) !important;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08) !important;
      color: #0f172a !important;
    }
    html.light .glass-input {
      background: rgba(248, 250, 252, 0.95) !important;
      border: 1px solid rgba(203, 213, 225, 0.8) !important;
      color: #0f172a !important;
    }
    html.light .glass-input:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }

    /* Scanline for Proctoring preview */
    .proctor-scanline {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.9), transparent);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.8);
      animation: scanline 2.6s ease-in-out infinite;
    }
    @keyframes scanline {
      0% { top: 0%; opacity: 0.2; }
      50% { top: 96%; opacity: 0.9; }
      100% { top: 0%; opacity: 0.2; }
    }

    /* Radar animation for live proctoring dashboard */
    .radar-pulse {
      position: relative;
    }
    .radar-pulse::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: 2px solid #f43f5e;
      border-radius: 50%;
      animation: radar-grow 2s linear infinite;
      opacity: 0;
    }

    @keyframes radar-grow {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Branded Loading Overlay with Logo Pulse & Skeleton Shimmer -->
  <div id="app-loading" class="fixed inset-0 bg-[#080a10] z-50 flex flex-col items-center justify-center p-6 space-y-6 select-none">
    <div class="relative flex items-center justify-center">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-0.5 shadow-2xl shadow-cyan-500/30 animate-pulse">
        <div class="w-full h-full bg-[#0d1117] rounded-[14px] flex items-center justify-center">
          <svg class="w-9 h-9 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
      </div>
      <div class="absolute -inset-4 rounded-full bg-cyan-500/20 blur-xl -z-10 animate-pulse"></div>
    </div>

    <div class="text-center space-y-1.5">
      <div class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
        CodeSphere <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 font-extrabold text-xs uppercase px-2 py-0.5 rounded-md bg-cyan-400/10 border border-cyan-400/20 tracking-widest">Pro</span>
      </div>
      <p class="text-xs text-slate-400 tracking-wide font-medium">Initializing secure compiler, proctoring & dashboard...</p>
    </div>

    <!-- Skeleton Shimmer Progress Bar -->
    <div class="w-56 h-1.5 rounded-full bg-slate-800/80 overflow-hidden relative border border-slate-700/50">
      <div class="h-full bg-gradient-to-r from-indigo-500 via-cyan-400 to-indigo-500 rounded-full animate-pulse" style="width: 75%;"></div>
    </div>
  </div>

  <!-- Primary Application Wrapper -->
  <div id="app-container" class="flex-grow flex flex-col min-h-screen hidden">
    <!-- Will be populated by JS Modules -->
  </div>

  <!-- Main ES6 Entry Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
